<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- GitHub dark canvas background -->
  <rect width="512" height="512" rx="112" fill="#0d1117"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Interlocking "W" Pipeline Structure -->
  <!-- Left Wing -->
  <path d="M110 160 L180 360 L240 230" fill="none" stroke="url(#nexusGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right Wing -->
  <path d="M272 230 L332 360 L402 160" fill="none" stroke="url(#nexusGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Arrow / Waypoint Apex -->
  <path d="M220 250 L256 170 L292 250 Z" fill="url(#glowGrad)" filter="url(#neon)"/>

  <!-- Connecting Cross-DAG Bridge -->
  <line x1="180" y1="360" x2="332" y2="360" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 18" opacity="0.8"/>

  <!-- Milestone Commit Nodes -->
  <circle cx="110" cy="160" r="16" fill="#0d1117" stroke="#2dd4bf" stroke-width="7"/>
  <circle cx="110" cy="160" r="6" fill="#2dd4bf"/>

  <circle cx="180" cy="360" r="18" fill="#0d1117" stroke="#3b82f6" stroke-width="7"/>
  <circle cx="180" cy="360" r="7" fill="#3b82f6"/>

  <circle cx="256" cy="170" r="14" fill="#ffffff" filter="url(#neon)"/>

  <circle cx="332" cy="360" r="18" fill="#0d1117" stroke="#8b5cf6" stroke-width="7"/>
  <circle cx="332" cy="360" r="7" fill="#8b5cf6"/>

  <circle cx="402" cy="160" r="16" fill="#0d1117" stroke="#a855f7" stroke-width="7"/>
  <circle cx="402" cy="160" r="6" fill="#a855f7"/>
</svg>
